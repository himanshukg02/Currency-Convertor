<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Currency Converter</title>
  <link href="style.css" rel="stylesheet" />
  <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
</head>
<body>
  <div class="container">
    <h2>Currency Converter</h2>
    <form id="converterForm">
      <div class="amount">
        <p>Enter Amount</p>
        <input id="amount" value="1" type="number" min="0.01" step="any" required />
      </div>

      <div class="dropdown">
        <div class="from">
          <p>From</p>
          <div class="select-container">
            <img id="fromFlag" src="https://flagsapi.com/US/flat/64.png" alt="From flag" />
            <select name="from" id="from"></select>
          </div>
        </div>

        <i class="fa-solid fa-arrow-right-arrow-left" id="swap"
           title="Swap currencies" role="button" tabindex="0" aria-label="Swap currencies"></i>

        <div class="to">
          <p>To</p>
          <div class="select-container">
            <img id="toFlag" src="https://flagsapi.com/IN/flat/64.png" alt="To flag" />
            <select name="to" id="to"></select>
          </div>
        </div>
      </div>

      <div class="msg" id="msg" aria-live="polite">Getting exchange rate...</div>
      <button type="submit" id="convertBtn">Get Exchange Rate</button>
    </form>
  </div>

  <script src="codes.js"></script>
  <script src="app.js"></script>
</body>
</html>
